[project]
name = "pulsebrief"
version = "0.1.0"
description = "An evidence-grounded daily AI news assistant with a Vue web client."
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.17,<2.0",
    "celery[redis]>=5.6,<6.0",
    "defusedxml>=0.7,<1.0",
    "email-validator>=2.3,<3.0",
    "fastapi>=0.135,<1.0",
    "feedparser>=6.0.12,<7.0",
    "httpx>=0.28,<1.0",
    "httpcore>=1.0,<2.0",
    "itsdangerous>=2.2,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "pydantic-settings>=2.13,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0.48,<2.1",
    "uvicorn[standard]>=0.42,<1.0",
]

[dependency-groups]
dev = ["pytest>=9.1,<10.0", "pytest-cov>=7.1,<8.0", "ruff>=0.15,<1.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "B008", "S105", "S106", "S107", "S110", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
