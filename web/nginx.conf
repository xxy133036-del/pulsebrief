server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker assigns a new container IP whenever the API is recreated. Resolve
    # its service name at request time so Nginx does not keep a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        # Authentication throttling is enforced by FastAPI/Redis using the
        # Cloudflare-overwritten CF-Connecting-IP header. Nginx sees the
        # cloudflared container as its peer, so per-peer limits here would be global.
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
